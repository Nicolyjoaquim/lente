<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: app de bolso — fundo lavanda, cartão-destaque em gradiente roxo, cartões brancos arredondados empilhados, navegação inferior por telas. */
:root{
  --bg:#F3F1FA; --card:#FFFFFF; --ink:#1B1530; --ink-2:#433C5E; --muted:#7A7495; --hair:#E8E4F4; --tint:#F1EEFB;
  --p1:#5A3FD6; --p2:#7E5FF7; --p-soft:#ECE6FE; --on-p:#FFFFFF; --p-ink:#5A3FD6;
  --q:#E89A16; --q-soft:#FDF0D8; --j:#3B76F0; --j-soft:#E3ECFE; --d:#EE4B63; --d-soft:#FDE3E7; --n:#8A84A6;
  --good:#16A06D; --good-soft:#DDF4EA; --bad:#E5484D; --bad-soft:#FDE4E4;
  --i1:#3B82F6; --i2:#EF4444; --i3:#22C55E; --i4:#8B5CF6; --i5:#F59E0B; --i6:#EC4899;
  --f:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(27,21,48,.04),0 8px 24px rgba(27,21,48,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120F1F; --card:#1C1830; --ink:#F2EFFB; --ink-2:#CFC9E6; --muted:#A49DC2; --hair:#2E2847; --tint:#241F3B;
  --p-soft:#2C2452; --p-ink:#A792FF;
  --q:#F5B544; --q-soft:#3A2C10; --j:#79A3FF; --j-soft:#1D2A4F; --d:#FF7489; --d-soft:#42182A; --n:#9C96B8;
  --good:#4FD39B; --good-soft:#12352A; --bad:#FF7A7E; --bad-soft:#42191C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#120F1F; --card:#1C1830; --ink:#F2EFFB; --ink-2:#CFC9E6; --muted:#A49DC2; --hair:#2E2847; --tint:#241F3B;
  --p-soft:#2C2452; --p-ink:#A792FF;
  --q:#F5B544; --q-soft:#3A2C10; --j:#79A3FF; --j-soft:#1D2A4F; --d:#FF7489; --d-soft:#42182A; --n:#9C96B8;
  --good:#4FD39B; --good-soft:#12352A; --bad:#FF7A7E; --bad-soft:#42191C;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--p2);outline-offset:3px;border-radius:8px}
a{color:var(--p-ink)}
.muted{color:var(--muted)}
main{padding-block:12px 120px}

/* top */
.top{display:flex;align-items:center;gap:14px;padding-block:16px 10px}
.top .hello h1{font-size:24px;font-weight:800}
.top .hello p{margin:0;color:var(--muted);font-size:13.5px}
.back{width:40px;height:40px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.top .search{margin-left:auto;width:min(360px,52%)}
@media (max-width:640px){.top{flex-wrap:wrap}.top .search{width:100%;order:3}}

/* search */
.search{position:relative}
.search input{width:100%;font:inherit;font-size:14.5px;padding:12px 14px 12px 42px;border-radius:16px;border:1px solid var(--hair);background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.search .ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);color:var(--ink);border:1px solid var(--hair);border-radius:18px;box-shadow:0 18px 40px rgba(27,21,48,.16);list-style:none;margin:0;padding:6px;z-index:40;max-height:380px;overflow:auto}
.sugg li{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--tint)}
.sugg .tk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.sugg .nm{font-weight:600;font-size:14px;line-height:1.25}
.sugg .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.ready{background:var(--good-soft);color:var(--good)} .st.peer{background:var(--p-soft);color:var(--p-ink)} .st.none{background:var(--tint);color:var(--muted)}

/* hero card */
.hero{background:linear-gradient(140deg,var(--p1),var(--p2));color:var(--on-p);border-radius:26px;padding:22px;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(90,63,214,.28)}
.hero::after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-60px;top:-70px;background:rgba(255,255,255,.12)}
.hero::before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:40px;top:60px;background:rgba(255,255,255,.07)}
.hero>*{position:relative;z-index:1}
.hero .lbl{font-size:13.5px;opacity:.85;font-weight:500}
.hero .big{font-size:clamp(36px,8vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0 16px}
.hero .row{display:flex;gap:28px;flex-wrap:wrap}
.hero .row div span{display:block;font-size:12px;opacity:.8}
.hero .row div b{font-size:19px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:13.5px}
.pill i{width:10px;height:10px;border-radius:50%;background:#fff;display:inline-block}
.hero .tk{font-size:13px;opacity:.8;font-weight:600}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.full{grid-column:1/-1}
.card h2{font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card h2 .dot{width:22px;height:22px;border-radius:8px;background:var(--p-soft);display:grid;place-items:center}
.card h2 .dot::after{content:"";width:8px;height:8px;border-radius:3px;background:var(--p2)}
.card p{margin:0}
.lead{color:var(--ink-2);font-size:14.5px}

/* donut legend */
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:420px){.donut{grid-template-columns:120px minmax(0,1fr);gap:12px}}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.leg li{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.leg .sq{width:12px;height:12px;border-radius:4px}
.leg b{font-weight:700;font-size:13.5px;white-space:nowrap}
.leg li.off{color:var(--muted)}
.leg li.off b{font-weight:600}

/* list rows */
.rows{display:flex;flex-direction:column}
.rowi{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--hair)}
.rowi:first-child{border-top:0}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.rowi .t{font-weight:700;font-size:14.5px;line-height:1.3}
.rowi .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.rowi .v{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}
.rowi .v small{display:block;font-weight:600;font-size:12px}
.up{color:var(--good)} .dn{color:var(--bad)} .eq{color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block}
.chip.up{background:var(--good-soft)} .chip.dn{background:var(--bad-soft)} .chip.eq{background:var(--tint)}
.conn{padding-left:54px;font-size:12px;color:var(--p-ink);font-weight:700;margin:-4px 0 -4px}

/* home */
.cases .rowi{cursor:pointer;border-radius:14px}
.cases .rowi:hover{background:var(--tint)}
.cases .rowi .tile{background:none;width:46px;height:46px}
.hero .search input{border:0;box-shadow:0 6px 16px rgba(20,10,60,.18);font-size:15px;padding:15px 16px 15px 44px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quick button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}

/* scen + levers */
.seg{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:14px;width:fit-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.levers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
@media (max-width:640px){.levers{grid-template-columns:minmax(0,1fr)}}
.lever label{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600}
.lever output{color:var(--p-ink);font-weight:800}
.lever input{width:100%;accent-color:var(--p2)}
.lever small{font-size:12px;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.minis{gap:8px}.mini{padding:10px}.mini b{font-size:15.5px}.mini span,.mini small{font-size:11px}}
.mini{background:var(--tint);border-radius:16px;padding:12px 14px}
.mini span{font-size:12px;color:var(--muted);font-weight:600}
.mini b{display:block;font-size:19px;font-weight:800}
.mini small{font-size:12px;color:var(--muted)}
.mini.alert{background:var(--bad-soft)} .mini.alert b{color:var(--bad)}

/* analyses */
.an{display:flex;flex-direction:column;gap:14px}
.an .head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;align-items:center}
.an .head .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.an .head h3{font-size:18px;font-weight:800;line-height:1.25}
.calc{border:0;background:var(--p-soft);color:var(--p-ink);padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700}
.notes{display:flex;gap:8px;flex-wrap:wrap}
details.more summary{cursor:pointer;color:var(--p-ink);font-weight:700;font-size:13.5px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" ▾"} details.more[open] summary::after{content:" ▴"}
details.more>div{margin-top:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--hair);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11.5px;color:var(--muted);font-weight:700}
tr.hl td{font-weight:700}
td.na{font-size:11.5px;color:var(--p-ink);font-weight:600}
.tag{font-size:12px;font-weight:700;color:var(--p-ink)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--hair);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f);font-size:11px}
.chart .lbl{fill:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* comitê */
.vote{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.vote button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px}
.vote button b{margin-left:6px}
.vote button.on{background:#fff;color:var(--p1)}
.vnote{margin:10px 0 0 !important;font-size:12.5px;opacity:.85;max-width:70ch}
.card ol,.card ul.l{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-2)}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--card);border-radius:22px;box-shadow:0 10px 30px rgba(27,21,48,.16);display:flex;gap:2px;padding:6px;width:min(560px,calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)))}
.nav button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav button svg{width:20px;height:20px}
.nav button[aria-current="page"]{color:var(--p-ink);background:var(--p-soft)}
.nav button:disabled{opacity:.35;cursor:default}

/* modal + misc */
.scrim{position:fixed;inset:0;background:rgba(18,12,40,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.modal{background:var(--card);border-radius:24px;max-width:600px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.modal h3{font-size:20px;font-weight:800}
.modal pre{font-family:var(--f);font-size:13.5px;background:var(--tint);padding:14px;border-radius:14px;white-space:pre-wrap;margin:0}
.btn{border:0;background:var(--p1);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--hair)}
textarea{width:100%;min-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--card);color:var(--ink);border:1px solid var(--hair);border-radius:16px;padding:14px}
.err{color:var(--bad);font-size:13.5px}
.src{font-size:12.5px;color:var(--muted)}
.src a{word-break:break-word}
.kicker{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.newco{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.8fr);gap:16px;padding-block:8px}
@media (max-width:820px){.newco{grid-template-columns:minmax(0,1fr)}}
.newco>div{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.newco h1{font-size:24px;font-weight:800;margin:4px 0 8px}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2);font-size:14px}
footer{color:var(--muted);font-size:12px;padding-block:8px 0}
.sub{font-size:13px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sowhat{background:var(--p-soft);border-radius:16px;padding:14px 16px;margin-top:14px}
.sowhat b{font-size:13px;color:var(--p-ink);text-transform:uppercase;letter-spacing:.02em}
.sowhat p{margin:4px 0 0 !important;font-size:14.5px;line-height:1.45;color:var(--ink)}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--hair);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 16px;display:grid;gap:2px}
.tl li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--p2);box-shadow:0 0 0 3px var(--card,#fff)}
.tl time{font-size:12px;font-weight:800;color:var(--p-ink)}
.tl p{margin:0 !important;font-size:13.5px;line-height:1.4;color:var(--ink)}
.tl small{font-size:11.5px;color:var(--muted)}
.mk{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.4;color:var(--ink-2)}
.ot{border-radius:16px;padding:2px 14px 14px}
.ot.up{background:var(--good-soft)} .ot.dn{background:var(--bad-soft)}
.ot.up .sub{color:var(--good)} .ot.dn .sub{color:var(--bad)}
.ot .mk{color:var(--ink)}
.adv{display:flex;flex-wrap:wrap;gap:8px}
.adv span{background:var(--tint);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.rowi .s{overflow-wrap:anywhere}
:root{--accent:var(--p2)}
</style>

/* ---------- engine ---------- */
const L = 5; // LTM index
function at(a,i){return a&&isN(a[i])?a[i]:null;}
function wacc(c){
  if(c.w && c.builtin) return c.w;
  const m=c.m, nd=at(c.s.nd,L), E=m.px*m.sh/1e6, D=Math.max(0,nd);
  const de=D/E, bl=m.bu*(1+(1-G.tax)*de), keu=G.rf+bl*G.erp+G.embi*G.vol;
  const keb=(1+keu)*(1+G.pib)/(1+G.pus)-1, kd=G.selic+m.spread, kdp=kd*(1-G.tax), ke=Math.max(keb,kd+0.02), we=E/(E+D);
  return {bu:m.bu,de,bl,keu,keb,kd,kdp,ke,we,wacc:we*ke+(1-we)*kdp,t:m.t,spr:m.spread};
}
function hist(c){
  const s=c.s, n=c.years.length, out=[];
  for(let i=0;i<n;i++){
    const o={};
    const rev=at(s.rev,i), ebit=at(s.ebit,i), ll=at(s.ll,i), lair=at(s.lair,i), fix=at(s.fix,i), eb=at(s.ebitda,i), nd=at(s.nd,i), fin=at(s.fin,i);
    if(i>0){
      const r0=at(s.rev,i-1), e0=at(s.ebit,i-1), l0=at(s.ll,i-1);
      o.drev = (rev!=null&&r0)? rev/r0-1:null;
      o.debit= (ebit!=null&&e0)? ebit/e0-1:null;
      o.dll  = (ll!=null&&l0!=null)? (l0<=0?'n/i':ll/l0-1):null;
      const cf = s.comp? s.comp[i]:1;
      if(cf===0){o.gao='série quebrada';o.gaf='série quebrada';}
      else{
        if(o.drev==null||o.debit==null) o.gao=null;
        else if(Math.abs(o.drev)<0.02) o.gao='instável';
        else if(o.drev*o.debit<0) o.gao='compressão de margem';
        else o.gao=o.debit/o.drev;
        if(ll==null||l0==null||o.debit==null) o.gaf=null;
        else if(ll<=0||l0<=0) o.gaf='n/i (lucro ≤ 0)';
        else if(Math.abs(o.debit)<0.02) o.gaf='instável';
        else o.gaf=o.dll/o.debit;
      }
      o.gat = isN(o.gao)&&isN(o.gaf)? o.gao*o.gaf : (o.gao==null&&o.gaf==null?null:'n/i');
    }
    o.gaoe = (ebit!=null&&fix!=null)? (ebit>0?(ebit+fix)/ebit:'n/i (EBIT ≤ 0)'):null;
    o.gafe = (ebit!=null&&lair!=null)? (lair>0?ebit/lair:'n/i (LAIR ≤ 0)'):null;
    o.gate = isN(o.gaoe)&&isN(o.gafe)? o.gaoe*o.gafe : (o.gaoe==null?null:'n/i');
    o.nde = (nd!=null&&eb)? (eb>0?nd/eb:'n/i'):null;
    o.cob = (ebit!=null&&fin!=null)? (fin>=0?'caixa líquido':ebit/-fin):null;
    const atv=at(s.at,i), pl=at(s.pl,i);
    if(rev&&ll!=null&&atv&&pl){o.ml=ll/rev;o.giro=rev/atv;o.mult=pl>0?atv/pl:null;o.roe=o.mult?o.ml*o.giro*o.mult:null;}
    if(ll!=null&&lair) o.ctrib= lair>0? ll/lair:null;
    if(lair!=null&&ebit) o.cjur= ebit>0? lair/ebit:null;
    if(ebit!=null&&rev) o.mebit=ebit/rev;
    if(eb!=null&&rev) o.mebitda=eb/rev;
    if(s.llaj&&at(s.llaj,i)!=null&&pl) o.roeaj=at(s.llaj,i)/pl;
    out.push(o);
  }
  return out;
}
function value(c){
  const s=c.s,m=c.m,w=wacc(c);
  const ebit=at(s.ebit,L), eb=at(s.ebitda,L), nd=at(s.nd,L), plt=at(s.plt,L);
  const mcap=m.px*m.sh/1e6, ev=mcap+nd+(m.nci||0);
  const t=w.t, nopat=ebit*(1-t), cap=plt+nd, roic=cap>0?nopat/cap:null;
  const o={mcap,ev,evebitda:eb>0?ev/eb:null,evebit:ebit>0?ev/ebit:null,peer:c.peer,wacc:w.wacc,t,nopat,cap,roic};
  o.prem = isN(o.evebitda)? o.evebitda/c.peer-1:null;
  o.spread = isN(roic)? (roic-w.wacc)*100:null;
  o.eva = isN(roic)? (roic-w.wacc)*cap:null;
  o.mva = ev-cap;
  o.gimp = (isN(roic)&&roic>w.wacc+0.02)? (ev*w.wacc-nopat)/(ev-nopat/roic) : null;
  o.kds = isN(roic)? (roic-w.kdp)*100:null;
  if(s.intang&&at(s.intang,L)!=null){ o.capx=cap-at(s.intang,L); o.roicx=o.capx>0?nopat/o.capx:null; o.spreadx=isN(o.roicx)?(o.roicx-w.wacc)*100:null; o.pltang=at(s.pl,L)-at(s.intang,L);}
  return o;
}
function archetype(c){
  const H=hist(c), V=value(c), s=c.s, reg=c.m.regua;
  const rel = isN(V.evebitda)? V.evebitda/c.peer : null;
  const s1 = at(s.ll,L)<0?1:0;
  const mg5=H[4]&&H[4].mebitda, mgL=H[L].mebitda;
  const dmg = isN(mg5)&&isN(mgL)? (mgL-mg5)*100 : null;
  const s2 = isN(dmg)&&dmg<-2?1:0;
  const s3 = isN(V.pltang)&&V.pltang<=0?1:0;
  const sig=s1+s2+s3, nde=H[L].nde, gafe=H[L].gafe;
  const T=[];
  const add=(k,ok,val,note)=>T.push({k,ok,val,note});
  let label, cls, sub='';
  const eb=at(s.ebitda,L), pl=at(s.pl,L);
  if(!(eb>0)||!(pl>0)){label='Exceção';cls='neutral';sub='EBITDA ou PL ≤ 0: múltiplos e ROE não se aplicam';}
  else if(rel<=0.6 && sig>=1){label='Desconto sob suspeita';cls='trap';sub=sig+' de 3 sinais de armadilha';}
  else if(isN(V.spread)&&V.spread>=5&&isN(nde)&&nde<=1&&(rel>=1.2||(isN(V.gimp)&&V.gimp>=G.glim))){label='Qualidade a preço exigente';cls='champ';sub='qualidade alta, preço exigente';}
  else if(isN(V.spread)&&V.spread>=5&&isN(nde)&&nde<=1){label='Qualidade a preço justo';cls='champ';sub='qualidade sem exagero no preço';}
  else if((isN(nde)&&nde>reg)||(isN(gafe)&&gafe>=2)){label='Retorno dependente de juros';cls='lev';sub= V.kds>0?'dívida a favor do acionista':'dívida contra o acionista';}
  else if(isN(dmg)&&dmg>2&&rel<=0.8){label='Recuperação em curso';cls='champ';sub='melhora ainda não precificada';}
  else if(isN(V.spread)&&V.spread<-3){label='Destruição de valor';cls='trap';sub='retorno abaixo do custo de capital';}
  else {label='Sem tese definida';cls='neutral';sub='sem tese clara pelos números';}
  add('Múltiplo ÷ pares', rel!=null&&(rel<=0.6||rel>=1.2), xx(rel,2), rel<=0.6?'desconto forte':rel>=1.2?'prêmio forte':'em linha');

  if(k.kind==='rental'){const f=c.years.map((_,i)=>k.gross[i]==null?null:s.ebitda[i]+k.book[i]-k.gross[i]);return {f,after:f.map((v,i)=>v==null?null:v+s.fin[i]),afterLbl:'após resultado financeiro (DRE)'};}
  const f=c.years.map((_,i)=>k.fco[i]==null?null:k.fco[i]-k.capex[i]);
  return {f,after:k.juros?f.map((v,i)=>v==null?null:v-k.juros[i]):null,afterLbl:'após juros pagos'};
}

  return {body,more,calc:cl};

function riskFlags(c,A){
  const V=A.V,H=A.H,F=[],s=c.s;
  if(isN(V.gimp)&&V.gimp>G.glim) F.push(`O preço embute crescimento perpétuo de ${pct(V.gimp)} ao ano em reais, contra limiar de ${pct(G.glim)}.`);
  if(c.peers.length>1&&isN(A.rel)&&A.rel<1.2&&A.label==='Qualidade a preço exigente') F.push(`Contra os pares globais o múltiplo está em linha (${xx(A.rel,2)} da mediana): se o comitê usar pares globais como referência, o preço deixa de parecer exigente.`);
  if(isN(H[4].mult)&&isN(H[3].mult)&&H[4].mult-H[3].mult>0.3) F.push(`O ROE do último ano subiu pelo multiplicador (${xx(H[3].mult,2)} → ${xx(H[4].mult,2)}), ou seja, por mudança no balanço, não por operação.`);
  if(isN(V.spread)&&Math.abs(V.spread)<2) F.push(`ROIC praticamente igual ao WACC (${pp(V.spread)}): a empresa não cria valor econômico hoje.`);
  if(isN(H[L].cob)&&H[L].cob<2) F.push(`Cobertura de juros de ${xx(H[L].cob,2)}: ${H[L].cob<1?'o EBIT não paga os juros':'pouca folga se o EBIT cair'}.`);
  const st=SCEN[c.code]&&sim(c,SCEN[c.code].Estresse); if(st) F.push(`No cenário de estresse, o preço implícito vai a ${brl(st.PX1)} (${spct(st.PX1/c.m.px-1)}).`);
  if(isN(V.evebit)&&c.peerEvebit&&V.evebit>=c.peerEvebit*0.9&&A.rel<0.8) F.push(`O desconto some no EV/EBIT (${xx(V.evebit,1)} contra ${xx(c.peerEvebit,1)}): o "barato" vem da D&A elevada.`);
  if(isN(V.pltang)&&V.pltang<=0) F.push(`PL tangível negativo: o patrimônio é quase todo ágio, e o P/VP baixo não indica pechincha.`);
  if(isN(V.prem)&&V.prem>0.15&&c.kind==='rental') F.push(`Prêmio de ${pct(V.prem,0)} sobre a Movida exige que a vantagem de custo de dívida e de escala se mantenha.`);
  return F.slice(0,4);
}
function reco(c,A){const r=reco0(c,A);return [r[0],r[1].replace(/\.\./g,'.')];}
function reco0(c,A){
  const V=A.V,cf=counter(c,A);
  if(A.label==='Qualidade a preço exigente') return ['Leitura neutra',`Qualidade excepcional, mas o preço exige crescimento acima do limiar. ${cf[0]?cf[0].t+' '+cf[0].v+'.':''}`];
  if(A.label==='Qualidade a preço justo') return ['Leitura favorável','Qualidade com preço em linha.'];
  if(A.label.startsWith('Retorno dependente')) return [V.kds>0?'Leitura favorável, condicionada a juros':'Leitura desfavorável',`A dívida rende mais do que custa, mas o ROIC mal cobre o WACC. A tese depende da queda da Selic e da normalização da depreciação.`];
  if(A.label.startsWith('Desconto')) return ['Leitura desfavorável até o gatilho',`${A.sig} de 3 sinais de armadilha. Reavaliar se a sinistralidade cair: ${cf[0]?cf[0].t.toLowerCase()+' '+cf[0].v:''}. A assimetria existe: ${cf[1]?cf[1].v:''} no cenário de −2 p.p.`];
  if(A.label==='Recuperação em curso') return ['Leitura favorável, com risco elevado','Melhora de margem ainda não precificada.'];
  if(A.label==='Destruição de valor') return ['Leitura desfavorável','Retorno abaixo do custo de capital.'];
  return ['Sem leitura definida','Os números não apontam direção clara.'];
}

function thesisLine(c,A){
  const V=A.V;
  if(A.label==='Qualidade a preço exigente') return `Retorno muito acima do custo de capital (ROIC ${pct(V.roic)} contra WACC ${pct(V.wacc)}), sem dívida. O preço, porém, embute crescimento perpétuo de ${pct(V.gimp)} ao ano, acima do limiar de ${pct(G.glim)}. O risco é de múltiplo, não de operação.`;
  if(A.label==='Qualidade a preço justo') return `Retorno muito acima do custo de capital e balanço leve, com múltiplo em linha com os pares.`;
  if(A.label.startsWith('Retorno dependente')) return `Os juros consomem ${pct(1-(A.H[L].cjur||0),0)} do EBIT e amplificam qualquer choque (GAT estrutural ${xx(A.H[L].gate,1)}). A dívida rende mais do que custa (ROIC − Kd ${pp(V.kds)}), mas o retorno total mal cobre o custo de capital (${pp(V.spread)}).`;
  if(A.label.startsWith('Desconto')) return `Desconto de ${pct(-V.prem,0)} no EV/EBITDA contra ${c.peerName}, mas ${A.sig} de 3 sinais de armadilha. No EV/EBIT o desconto some (${xx(V.evebit,1)} contra ${xx(c.peerEvebit,1)}).`;
  return `Sem tese clara pelos números.`;
}

function iris(A,size=150,center=true){
  const c=size/2,R=size*0.48,r0=size*0.31,n=A.tests.length,gap=0.035;
  let g='';
  A.tests.forEach((t,i)=>{
    const a0=-Math.PI/2+i*2*Math.PI/n+gap,a1=-Math.PI/2+(i+1)*2*Math.PI/n-gap,p=(r,a)=>[c+r*Math.cos(a),c+r*Math.sin(a)];
    const[x1,y1]=p(R,a0),[x2,y2]=p(R,a1),[x3,y3]=p(r0,a1),[x4,y4]=p(r0,a0);
    g+=`<path d="M${x1} ${y1} A${R} ${R} 0 0 1 ${x2} ${y2} L${x3} ${y3} A${r0} ${r0} 0 0 0 ${x4} ${y4} Z" fill="${t.ok?ACOL[A.cls]:'var(--tint)'}"><title>${esc(t.k)}: ${esc(t.val)}</title></path>`;});
  const on=A.tests.filter(t=>t.ok).length;
  if(center) g+=`<text x="${c}" y="${c-size*0.03}" text-anchor="middle" style="font-size:${size*0.075}px;font-weight:600" fill="var(--muted)">testes</text><text x="${c}" y="${c+size*0.1}" text-anchor="middle" style="font-size:${size*0.15}px;font-weight:800" fill="var(--ink)">${on}/${n}</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%;height:auto;display:block" role="img" aria-label="${on} de ${n} testes disparados">${g}</svg>`;
}

function lineChart(years,series,fmt,label){
  const W=560,H=210,pl=50,pr=14,pt=14,pb=28;
  const vals=series.flatMap(s=>s.values.filter(isN)); if(!vals.length) return '';
  let lo=Math.min(0,...vals), hi=Math.max(...vals); const pad=(hi-lo)*0.1||1; hi+=pad; if(lo<0) lo-=pad;
  const idx=years.map((y,i)=>i), X=i=>pl+(W-pl-pr)*(years.length===1?0.5:i/(years.length-1)), Yp=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  let g='';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3,y=Yp(v);g+=`<line class="ax" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" ${k?'stroke-dasharray="2 5"':''}/><text x="${pl-8}" y="${y+3}" text-anchor="end">${fmt(v)}</text>`;}
  years.forEach((y,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle">${y}</text>`);
  series.forEach(s=>{
    let d='',open=false,area='',first=null,last=null;
    s.values.forEach((v,i)=>{if(isN(v)){d+=(open?'L':'M')+X(i)+' '+Yp(v)+' ';if(first==null)first=i;last=i;open=true;}else open=false;});
    if(s.area&&first!=null) g+=`<path d="${d} L${X(last)} ${Yp(Math.max(lo,0))} L${X(first)} ${Yp(Math.max(lo,0))} Z" fill="${s.color}" opacity=".10"/>`;
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
    s.values.forEach((v,i)=>{if(isN(v)) g+=`<circle cx="${X(i)}" cy="${Yp(v)}" r="${i===last?4.5:2.5}" fill="${s.color}"/>`;});
    if(last!=null) g+=`<text class="lbl" x="${Math.min(X(last),W-pr)}" y="${Yp(s.values[last])-10}" text-anchor="end" style="font-weight:500">${fmt(s.values[last])}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg>${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}</div>`;
}
function barChart(items,fmt,label){
  const W=560,rowh=34,pl=104,pr=64,H=items.length*rowh+8;
  const vals=items.map(i=>i.value).filter(isN); const lo=Math.min(0,...vals), hi=Math.max(...vals,0);
  const X=v=>pl+(W-pl-pr)*((v-lo)/((hi-lo)||1));
  let g=`<line class="ax" x1="${X(0)}" x2="${X(0)}" y1="0" y2="${H-4}"/>`;
  items.forEach((it,i)=>{const y=i*rowh+4, x0=X(Math.min(0,it.value)), x1=X(Math.max(0,it.value));
    g+=`<text class="lbl" x="${pl-10}" y="${y+18}" text-anchor="end" style="font-family:var(--f-body);font-size:12.5px;${it.hl?'font-weight:600':''}">${esc(it.label)}</text>`;
    g+=`<rect x="${x0}" y="${y+6}" width="${Math.max(2,x1-x0)}" height="${rowh-16}" rx="9" fill="${it.hl?'var(--accent)':'var(--hair)'}"/>`;
    g+=`<text x="${x1+8}" y="${y+18}" class="lbl" style="${it.hl?'font-weight:500':''}">${fmt(it.value)}</text>`;});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}</svg></div>`;
}

  const extra=COS.filter(c=>!c.builtin).map(c=>({ticker:c.ticker,name:c.name,sector:c.sector,st:'ready'}));
  return [...DIR.filter(d=>!extra.find(e=>e.ticker===d.ticker)),...extra];
}
function bindSearch(id){
  const inp=document.getElementById(id), list=document.getElementById(id+'-list'); let items=[], sel=0;
  const draw=()=>{
    const q=norm(inp.value.trim());
    const all=allEntries();
    items=(q?all.filter(e=>norm(e.name).includes(q)||norm(e.ticker).startsWith(q)||norm(e.sector).split(/\s+/).some(w=>w.startsWith(q))):all.filter(e=>e.st!=='none')).sort((a,b)=>({ready:0,peer:1,none:2}[a.st]-{ready:0,peer:1,none:2}[b.st])).slice(0,8);
    if(q&&!items.length){list.innerHTML=`<li aria-disabled="true"><span class="tk" style="background:var(--muted)">?</span><span class="nm">Nenhuma empresa encontrada. Carregue os dados em "Nova empresa".</span><span></span></li>`;list.hidden=false;inp.setAttribute('aria-expanded','true');return;}
    sel=Math.min(sel,items.length-1);
    list.innerHTML=items.map((e,i)=>`<li role="option" id="${id}-o${i}" aria-selected="${i===sel}" data-tk="${e.ticker}"><span class="tk" style="background:${tileColor(e.ticker)}">${esc(e.name.charAt(0))}</span><span class="nm">${esc(e.name)}<small>${e.ticker} · ${esc(e.sector)}</small></span><span class="st ${e.st}">${STL[e.st]}</span></li>`).join('');
    list.hidden=false; inp.setAttribute('aria-expanded','true');
  };
  const close=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');};
  inp.addEventListener('focus',draw); inp.addEventListener('input',()=>{sel=0;draw();});
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);draw();e.preventDefault();}
    else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault();}
    else if(e.key==='Enter'){if(items[sel]){open(items[sel].ticker);}e.preventDefault();}
    else if(e.key==='Escape'){close();}
  });
  list.addEventListener('mousedown',e=>{const li=e.target.closest('[data-tk]');if(li){e.preventDefault();open(li.dataset.tk);}});
  inp.addEventListener('blur',()=>setTimeout(close,120));
}

function open(tk){
  const ci=COS.findIndex(c=>c.ticker===tk);
  if(ci>=0){cur=ci;view='co';screen='painel';levers=[0,0,0,0,0,0];scenName='Base';render();window.scrollTo({top:0});return;}
  const e=DIR.find(d=>d.ticker===tk);
  if(e&&e.st==='peer'){pending={peer:e,of:COS[COS.findIndex(c=>c.ticker===PEEROF[tk])]};view='peer';render();return;}
  pending={peer:e}; view='nova'; render(); window.scrollTo({top:0});
}

function sAnalises(c,A,V){
  const H=A.H,s=c.s,w=wacc(c);
  const trow=(lab,k,f,hl)=>`<tr${hl?' class="hl"':''}><td>${lab}</td>${H.map(o=>cell(o[k],f)).join('')}</tr>`;
  const thead=`<thead><tr><th></th>${c.years.map(y=>`<th>${y}</th>`).join('')}</tr></thead>`;
  let out=`${heroCo(c,A,V)}<div class="grid">`;
  /* 1 */
  const r10=sim(c,[-0.1,0,0,0,0,0]),gate=H[L].gate,sel=-c.m.exp*0.01*(1-G.tax);
  const lvl=!isN(gate)?'os juros já superam o lucro operacional':gate<2?'risco de volume, não de estrutura':gate<4?'alavancagem moderada':'choques pequenos se multiplicam';
  out+=anCard(0,'Alavancagem',`−10% nas vendas, ${isN(r10.gL)?spct(r10.gL,0):'prejuízo maior'} no lucro: ${lvl}`,
   mini('GAO estrutural',fv2(H[L].gaoe),'(EBIT + fixos) ÷ EBIT')+mini('GAF estrutural',fv2(H[L].gafe),'EBIT ÷ LAIR')+mini('Selic +1 p.p.',(sel>0?'+':'')+mi(sel),'no lucro do 1º ano',sel<0),
   `<div class="grid" style="margin-top:0"><div>${lineChart(c.years,[{name:'GAO estrutural',values:H.map(o=>isN(o.gaoe)?o.gaoe:null),color:'var(--p2)'},{name:'GAF estrutural',values:H.map(o=>isN(o.gafe)?o.gafe:null),color:'var(--i5)'}],v=>nf(v,1)+'x','GAO e GAF')}</div><div>${lineChart(c.years,[{name:'Dívida líquida ÷ EBITDA',values:H.map(o=>isN(o.nde)?o.nde:null),color:'var(--i1)',area:true}],v=>nf(v,1)+'x','Dívida sobre EBITDA')}<p class="src">Régua do setor: ${xx(c.m.regua,1)}</p></div></div>`,
   `<div class="tw"><table>${thead}<tbody>${trow('Δ% receita','drev',v=>spct(v))}${trow('Δ% EBIT','debit',v=>spct(v))}${trow('Δ% lucro','dll',v=>spct(v))}${trow('GAO (fórmula da matéria)','gao',v=>xx(v,2),1)}${trow('GAF (fórmula da matéria)','gaf',v=>xx(v,2),1)}${trow('GAT','gat',v=>xx(v,2),1)}${trow('Cobertura de juros','cob',v=>xx(v,2))}</tbody></table></div><p class="src">Quando a fórmula engana, aparece o motivo: série quebrada (fusão), instável (variação abaixo de 2%), compressão de margem ou lucro ≤ 0.</p>`,
   calc('GAO e GAF estruturais','GAO = (EBIT + custos fixos) ÷ EBIT ; GAF = EBIT ÷ LAIR',`GAO = (${nf(s.ebit[L])} + ${nf(s.fix[L])}) ÷ ${nf(s.ebit[L])} = ${isN(H[L].gaoe)?nf(H[L].gaoe,2):'n/i'}\nGAF = ${nf(s.ebit[L])} ÷ ${nf(s.lair[L])} = ${isN(H[L].gafe)?nf(H[L].gafe,2):'n/i'}`));
  /* 2 */
  const peers=[c.name,...c.peers].map(n=>DATA.comp.find(p=>p.name===n)).filter(Boolean);
  const me=isN(H[4].roe)?H[4]:H[L];const facs=[['ml','margem'],['giro','giro do ativo'],['mult','alavancagem']];
  let drv='';if(peers.length>1){const ps=peers.slice(1);const res=facs.map(([k,l])=>({l,r:me[k]/median(ps.map(q=>q[k]))}));drv=res.reduce((a,b)=>b.r>a.r?b:a).l;}
  const jump=isN(H[4].mult)&&isN(H[3].mult)&&H[4].mult-H[3].mult>0.3;
  out+=anCard(1,'DuPont',c.code==='HAPV3'?'ROE perto de zero, sobre um patrimônio que é quase todo ágio':`ROE de ${pct(me.roe,0)}, puxado ${drv?'por '+drv:'pela operação'}${jump?' (e por um salto no multiplicador)':''}`,

        peer:j.ev_ebitda_pares,peerName:j.nome_pares||'pares',peers:[],peerEvebit:j.ev_ebit_pares,expNote:'dívida líquida no CDI (premissa)',varName:'custo variável',question:'Qual é a tese?'};

  };
}

    inp.onchange=()=>{const id=inp.id;keep(()=>render());const el=document.getElementById(id);if(el)el.focus({preventScroll:true});};
  });
  document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>castVote(COS[cur].ticker,b.dataset.vote));
}

/* ---------- votos do comitê: registro compartilhado (db) com recurso local ---------- */
let VDB=null,VME=null,VALL={},VMODE='local',VERR='',VBUSY=false;
function tally(t){if(VMODE==='shared'){const r={a:0,r:0,m:0};Object.values(VALL).forEach(d=>{const x=d&&d[t];if(x==='a'||x==='r'||x==='m')r[x]++;});return r;}return load('lente-votos-'+t,{a:0,r:0,m:0});}
function myVote(t){return VMODE==='shared'?((VALL[VME]||{})[t]||null):null;}
function onComite(){return view==='co'&&screen==='comite';}
async function castVote(t,k){
  if(VMODE!=='shared'){const key='lente-votos-'+t,v=load(key,{a:0,r:0,m:0});if(k==='z')store(key,{a:0,r:0,m:0});else{v[k]++;store(key,v);}keep(()=>render());return;}
  if(VBUSY)return;VBUSY=true;VERR='';
  const prev=VALL[VME]||{},next=Object.assign({},prev);
  if(k==='z'||prev[t]===k)delete next[t];else next[t]=k;
  VALL=Object.assign({},VALL,{[VME]:next});keep(()=>render());
  try{await VDB.doc('votes/'+VME).set(next);}
  catch(e){VALL=Object.assign({},VALL,{[VME]:prev});VERR=e&&e.code==='invalid_argument'?'Seu nível de acesso permite ver os votos, mas não votar.':'O voto não foi salvo; tente de novo.';keep(()=>render());}
  finally{VBUSY=false;}
}
(async()=>{try{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const db=await window.claude.use('db');if(!db)return;
  const u=await window.claude.use('user');const id=u?await u.id():null;if(!id)return;
  VDB=db;VME=id;VMODE='shared';
  db.collection('votes').onSnapshot(snap=>{const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()||{};});VALL=m;if(onComite())keep(()=>render());},
    ()=>{VMODE='local';VDB=null;if(onComite())keep(()=>render());});
  if(onComite())keep(()=>render());
}catch(e){VMODE='local';}})();

/* ---------- cotações ao vivo: API brapi.dev via Netlify Function (token fica no servidor) ---------- */
let LIVE={status:'loading'};
function applyQuotes(q){
  let n=0;
  COS.forEach(c=>{if(!c.builtin)return;const x=q&&q[c.ticker];
    if(x&&typeof x.price==='number'&&x.price>0){if(c.m.px0==null)c.m.px0=c.m.px;c.m.px=x.price;c.live=x;n++;}});
  return n;
}
(async()=>{
  await null; const KEY='lente-cotacoes',TTL=30*60*1000;
  try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
    if(s&&Date.now()-s.at<TTL&&applyQuotes(s.quotes)){LIVE={status:'ok'};keep(()=>render());return;}}catch(e){}
  try{
    const tk=COS.filter(c=>c.builtin).map(c=>c.ticker).join(',');
    const r=await fetch('/.netlify/functions/cotacao?tickers='+encodeURIComponent(tk));
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!applyQuotes(d.quotes))throw new Error('sem cotações');
    LIVE={status:'ok'};
    try{localStorage.setItem(KEY,JSON.stringify({at:Date.now(),quotes:d.quotes}));}catch(e){}
  }catch(e){LIVE={status:'fail'};}
  keep(()=>render());
})();

function keep(fn){const y=window.scrollY;fn();window.scrollTo({top:y});}
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-nav]'); if(n&&!n.disabled){const k=n.dataset.nav;if(k==='home'){view='home';pending=null;}else{screen=k;view='co';}render();window.scrollTo({top:0});return;}
  const o=e.target.closest('[data-open]'); if(o){open(o.dataset.open);return;}
  const g=e.target.closest('[data-go]'); if(g){pending=null;view=g.dataset.go;render();window.scrollTo({top:0});return;}
  const k=e.target.closest('[data-calc]'); if(k){const x=CALCS[+k.dataset.calc];openModal(`<div class="kicker">Memória de cálculo</div><h3>${esc(x.title)}</h3><pre>${esc(x.formula)}</pre><pre>${esc(x.subst)}</pre>${x.note?`<p class="src">${esc(x.note)}</p>`:''}`);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').innerHTML='';if(e.key==='Enter'){const o=e.target.closest&&e.target.closest('.rowi[data-open]');if(o)open(o.dataset.open);}});
(function(){const h=(location.hash||'').slice(1).toUpperCase();const ci=COS.findIndex(c=>c.ticker===h);if(ci>=0){cur=ci;view='co';}render();})();
</script>
